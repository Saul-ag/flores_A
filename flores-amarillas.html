<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz día de las flores amarillas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:ital,opsz,wght@1,9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --hand:"Caveat", "Segoe Script", "Bradley Hand", "Comic Sans MS", cursive;

  /* Amanecer de primavera (modo claro) */
  --sky1:#fff3c9;
  --sky2:#ffdf9a;
  --sky3:#ffc27a;
  --glow:rgba(255,226,120,.85);
  --ink:#4d2f0c;
  --ink-soft:#7a5320;
  --card:#fffaf0;
  --card-ink:#45300f;
  --amber1:#ffd93d;
  --amber2:#ffab00;
  --btn-ink:#3f2500;
  --ghost-bg:rgba(255,255,255,.62);
  --ghost-ink:#4d2f0c;
  --grass1:#78b356;
  --grass2:#4a8c40;
  --grass3:#2f6a33;
  --stars:0;
  --veil:rgba(70,40,5,.38);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky1:#0d0a27;
    --sky2:#2b1252;
    --sky3:#63235f;
    --glow:rgba(255,190,70,.26);
    --ink:#fff1bf;
    --ink-soft:#ffe39a;
    --ghost-bg:rgba(255,255,255,.14);
    --ghost-ink:#fff1bf;
    --grass1:#3f7d3f;
    --grass2:#26582f;
    --grass3:#173d26;
    --stars:1;
    --veil:rgba(6,3,22,.62);
  }
}
:root[data-theme="dark"]{
  --sky1:#0d0a27;
  --sky2:#2b1252;
  --sky3:#63235f;
  --glow:rgba(255,190,70,.26);
  --ink:#fff1bf;
  --ink-soft:#ffe39a;
  --ghost-bg:rgba(255,255,255,.14);
  --ghost-ink:#fff1bf;
  --grass1:#3f7d3f;
  --grass2:#26582f;
  --grass3:#173d26;
  --stars:1;
  --veil:rgba(6,3,22,.62);
}

:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%);
  color:var(--ink);
  font-family:var(--hand);
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;
  user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--amber2);outline-offset:3px}

.stage{position:relative;height:100%;width:100%;overflow:hidden;overflow:clip}

/* Cielo */
#stars{position:absolute;inset:0;z-index:1;opacity:var(--stars);pointer-events:none}
.star{position:absolute;border-radius:50%;background:#fff6d0;animation:twinkle var(--t,3s) ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.glow{
  position:absolute;z-index:1;top:-28%;left:50%;width:150%;aspect-ratio:1;
  transform:translateX(-50%);
  background:radial-gradient(circle,var(--glow) 0%,transparent 62%);
  pointer-events:none;
}

/* Suelo */
.hill{position:absolute;border-radius:50%;z-index:2}
.h1{left:-35%;bottom:-9%;width:95%;height:26%;background:radial-gradient(ellipse at 50% 25%,var(--grass1),var(--grass2))}
.h2{right:-35%;bottom:-10%;width:105%;height:23%;background:radial-gradient(ellipse at 50% 25%,var(--grass2),var(--grass3))}
.front{
  position:absolute;z-index:4;left:-5%;right:-5%;bottom:-2%;height:8%;
  background:linear-gradient(to top,var(--grass3),var(--grass2));
  border-radius:50% 50% 0 0 / 100% 100% 0 0;
  pointer-events:none;
}

/* Ramo */
.bouquet{position:absolute;z-index:3;left:50%;bottom:0;width:min(100%,640px);height:100%;transform:translateX(-50%);pointer-events:none}
.pos{
  position:absolute;bottom:0;transform:translateX(-50%);
  height:calc(var(--h) * 8px);
  height:min(calc(var(--h) * 1dvh), calc(var(--h) * 8px));
  aspect-ratio:1/3;
}
.flower{display:block;width:100%;height:100%;overflow:visible;transform-origin:50% 100%}
.go .flower{animation:sway var(--sw) ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes sway{from{transform:rotate(-1.8deg)}to{transform:rotate(2.2deg)}}

.stem{fill:none;stroke:#4a9a3c;stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.go .stem{animation:draw 2.3s cubic-bezier(.4,.1,.2,1) forwards;animation-delay:var(--d)}
@keyframes draw{to{stroke-dashoffset:0}}

.leaf{fill:url(#lg);transform:scale(0)}
.go .leaf{animation:pop .9s cubic-bezier(.2,1.3,.4,1) forwards;animation-delay:calc(var(--d) + var(--ld))}

.cup{transform:scale(0);transform-box:fill-box;transform-origin:50% 100%}
.go .cup{animation:pop 1.3s cubic-bezier(.2,1.3,.4,1) forwards;animation-delay:calc(var(--d) + 2s)}
@keyframes pop{to{transform:scale(1)}}

/* Partículas */
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}

/* Título */
.title{position:absolute;z-index:6;top:5.5%;left:0;right:0;padding:0 22px;text-align:center;pointer-events:none}
.title h1{
  margin:0;font-family:var(--display);font-style:italic;font-weight:600;
  font-size:clamp(32px,9.5vw,56px);line-height:1.04;letter-spacing:-.01em;
  text-shadow:0 2px 28px rgba(255,190,40,.55);
}
.title h1 span{display:inline-block;opacity:0;transform:translateY(14px);filter:blur(6px)}
.go .title h1 span{animation:rise .95s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.15s + var(--w) * .16s)}
.to{
  margin-top:8px;font-size:clamp(26px,7vw,36px);color:var(--ink-soft);opacity:0;
}
.go .to{animation:fade 1.1s ease forwards;animation-delay:1.3s}
@keyframes rise{to{opacity:1;transform:none;filter:none}}
@keyframes fade{to{opacity:1}}

/* Entrada */
.gate{
  position:absolute;inset:0;z-index:8;width:100%;border:0;padding:0;
  display:grid;place-items:center;
  background:radial-gradient(circle at 50% 46%,rgba(255,220,100,.2),transparent 58%);
  transition:opacity .9s ease,visibility .9s;
}
.gate.hide{opacity:0;visibility:hidden;pointer-events:none}
.gate .in{display:block;text-align:center;padding:24px}
.seed{
  display:grid;place-items:center;width:120px;height:120px;margin:0 auto 24px;border-radius:50%;
  background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.96),rgba(255,238,168,.78) 55%,rgba(255,192,56,.4));
  box-shadow:0 0 0 0 rgba(255,190,40,.55),0 0 56px rgba(255,190,40,.65);
  animation:pulse 2.3s ease-out infinite;
}
.seed svg{width:78px;height:auto;overflow:visible;filter:drop-shadow(0 5px 8px rgba(120,70,0,.28));animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(2px) rotate(-1.5deg)}50%{transform:translateY(-4px) rotate(1.5deg)}}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(255,190,40,.55),0 0 56px rgba(255,190,40,.65)}
  100%{box-shadow:0 0 0 42px rgba(255,190,40,0),0 0 56px rgba(255,190,40,.65)}
}
.gate h2{display:block;margin:0 0 6px;font-family:var(--display);font-style:italic;font-weight:600;font-size:clamp(28px,8vw,40px);color:var(--ink)}
.gate p{display:block;margin:0;font-size:26px;color:var(--ink-soft)}

/* Botones */
.controls{
  position:absolute;z-index:7;left:0;right:0;bottom:18px;padding:0 16px;
  display:flex;flex-wrap:wrap;gap:10px;justify-content:center;
  opacity:0;visibility:hidden;transform:translateY(14px);
  transition:opacity .8s ease,transform .8s ease,visibility .8s;
}
.controls.show{opacity:1;visibility:visible;transform:none}
.btn{
  min-height:48px;border-radius:999px;padding:10px 26px;border:0;
  font-family:var(--hand);font-weight:600;font-size:25px;line-height:1;
}
.btn.primary{
  background:linear-gradient(180deg,var(--amber1),var(--amber2));color:var(--btn-ink);
  box-shadow:0 10px 26px rgba(255,150,0,.42),inset 0 1px 0 rgba(255,255,255,.65);
}
.btn.ghost{
  background:var(--ghost-bg);color:var(--ghost-ink);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);
}

/* Carta */
.veil{
  position:absolute;inset:0;z-index:9;padding:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:var(--veil);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;visibility:hidden;transition:opacity .5s ease,visibility .5s;
}
.veil.open{opacity:1;visibility:visible}
.letter{
  width:min(100%,430px);max-height:calc(100% - 60px);flex:0 1 auto;min-height:0;overflow:auto;
  padding:30px 28px 26px;border-radius:20px;
  background:radial-gradient(circle at 15% 0%,rgba(255,214,90,.3),transparent 55%),var(--card);
  color:var(--card-ink);
  box-shadow:0 30px 80px rgba(0,0,0,.38),0 0 0 1px rgba(255,190,40,.4);
  transform:translateY(34px) scale(.94) rotate(-1.2deg);
  transition:transform .8s cubic-bezier(.2,1.2,.3,1);
  -webkit-user-select:text;user-select:text;
}
.veil.open .letter{transform:none}
.lflower{text-align:center;font-size:42px;line-height:1;margin-bottom:8px}
.lto{font-size:34px;font-weight:600;line-height:1.1;margin-bottom:10px}
#letterBody p{margin:0 0 12px;font-size:24px;line-height:1.32;font-weight:500}
#letterBody p.typing::after{
  content:"";display:inline-block;width:2px;height:1em;margin-left:2px;
  background:currentColor;vertical-align:-.14em;animation:blink .8s steps(1) infinite;
}
@keyframes blink{50%{opacity:0}}
.sig{margin-top:6px;text-align:right;font-size:30px;font-weight:600;opacity:0;transition:opacity 1.2s ease}
.sig.show{opacity:1}

@media (max-height:840px){
  .letter{padding:24px 24px 20px}
  .lflower{font-size:34px;margin-bottom:4px}
  .lto{font-size:30px;margin-bottom:8px}
  #letterBody p{font-size:21px;margin-bottom:9px}
  .sig{font-size:26px}
}
@media (max-height:700px){#letterBody p{font-size:19px;line-height:1.27}.lto{font-size:26px}.sig{font-size:22px}.lflower{display:none}}
@media (prefers-reduced-motion: reduce){
  .go .stem,.go .leaf,.go .cup,.go .title h1 span,.go .to{
    animation-duration:.01s !important;animation-delay:0s !important;
  }
  .go .flower,.star,.seed,.seed svg{animation:none !important}
  .letter,.controls{transition-duration:.01s}
}
</style>
</head>
<body>

<!-- Degradados compartidos por las flores -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="tg" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff9d00"/>
      <stop offset="1" stop-color="#ffe14d"/>
    </linearGradient>
    <linearGradient id="lg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3c8a3a"/>
      <stop offset="1" stop-color="#86c956"/>
    </linearGradient>
  </defs>
</svg>

<main class="stage" id="stage">
  <div id="stars"></div>
  <div class="glow"></div>
  <div class="hill h1"></div>
  <div class="hill h2"></div>
  <div class="bouquet" id="bouquet"></div>
  <div class="front"></div>
  <canvas id="fx"></canvas>

  <header class="title">
    <h1>
      <span style="--w:0">Feliz</span>
      <span style="--w:1">día</span>
      <span style="--w:2">de</span>
      <span style="--w:3">las</span>
      <span style="--w:4">flores</span>
      <span style="--w:5">amarillas</span>
    </h1>
    <div class="to" id="toLine"></div>
  </header>

  <div class="controls" id="controls">
    <button class="btn primary" id="openBtn" type="button">Abrir mi carta 💌</button>
    <button class="btn ghost" id="replayBtn" type="button">Ver de nuevo</button>
  </div>

  <button class="gate" id="gate" type="button" aria-label="Abrir el regalo">
    <span class="in">
      <span class="seed" id="seedBox" aria-hidden="true"></span>
      <h2 id="gateTitle">Tengo algo para ti</h2>
      <p>Toca para verlo florecer</p>
    </span>
  </button>

  <div class="veil" id="veil" role="dialog" aria-modal="true" aria-label="Carta">
    <div class="letter" id="letter">
      <div class="lflower" aria-hidden="true">🌷</div>
      <div class="lto" id="lto"></div>
      <div id="letterBody"></div>
      <div class="sig" id="sig"></div>
    </div>
    <button class="btn ghost" id="closeBtn" type="button">Cerrar</button>
  </div>
</main>

<script>
/* ---------- Personaliza aquí ---------- */
const CONFIG = {
  to: "Fátima",   // nombre de quien recibe
  from: "Saúl",   // quien lo manda
  letter: [
    "Fátima, te confieso algo, no sabía de esta fecha de las flores amarillas y me enteré tarde. Perdóname por no llegar con un ramo de verdad.",
    "Quería regalarte tulipanes y no pude, así que te hice este ramo con todo mi cariño, para que al menos florezca en tu pantalla.",
    "Lo más importante es que sepas lo especial que eres. Por tu forma de ser, por cómo haces sentir a quienes te rodean, todo se ve más bonito contigo cerca.",
    "Gracias por ser tú. Ojalá cada vez que abras estas flores te acuerdes de lo mucho que vales."
  ]
};
/* -------------------------------------- */

const $ = s => document.querySelector(s);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = $('#stage'), gate = $('#gate'), controls = $('#controls');
const veil = $('#veil'), letterEl = $('#letter');

$('#toLine').textContent = 'para ' + (CONFIG.to || 'ti') + ' 💛';
$('#lto').textContent = 'Para ' + (CONFIG.to || 'ti') + ',';
$('#sig').textContent = CONFIG.from ? 'Con cariño, ' + CONFIG.from : 'Con mucho cariño 💛';

/* Estrellas (solo se ven en modo oscuro) */
(function(){
  const box = $('#stars');
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('i');
    s.className = 'star';
    const z = 1 + Math.random() * 2;
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*58}%;width:${z}px;height:${z}px;--t:${2+Math.random()*3}s;--dl:${Math.random()*4}s`;
    box.appendChild(s);
  }
})();

/* Tulipanes */
const FLOWERS = [
  {x:6,  h:42, d:.7,  c:-12, sw:5.4},
  {x:15, h:56, d:.2,  c:10,  sw:6.2},
  {x:24, h:40, d:1.1, c:-8,  sw:4.9, front:1},
  {x:33, h:62, d:.4,  c:12,  sw:5.7},
  {x:42, h:48, d:.9,  c:-14, sw:6.5},
  {x:50, h:68, d:0,   c:8,   sw:5.5},
  {x:58, h:50, d:.6,  c:-10, sw:6.0},
  {x:67, h:60, d:.3,  c:14,  sw:5.1},
  {x:76, h:42, d:1.2, c:-9,  sw:5.8, front:1},
  {x:85, h:56, d:.8,  c:11,  sw:6.3},
  {x:94, h:46, d:.5,  c:-12, sw:5.0},
  {x:29, h:32, d:1.5, c:9,   sw:4.7, front:1},
  {x:71, h:34, d:1.7, c:-11, sw:5.2, front:1}
];

const TULIP = `
  <path d="M-19 -26 C-19 -4 -9 8 0 8 C9 8 19 -4 19 -26 C13 -20 9 -34 0 -48 C-9 -34 -13 -20 -19 -26 Z" fill="url(#tg)"/>
  <path d="M-9 4 C-14 -16 -8 -36 0 -46 C8 -36 14 -16 9 4 C4 9 -4 9 -9 4 Z" fill="rgba(255,244,150,.6)"/>
  <path d="M0 8 C-7 -6 -6 -28 0 -46" fill="none" stroke="rgba(190,100,0,.25)" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M0 8 C7 -6 6 -28 0 -46" fill="none" stroke="rgba(190,100,0,.25)" stroke-width="1.6" stroke-linecap="round"/>`;

function buildFlower(f){
  const hy = 84, c = f.c;
  const stem = `M60 360 C ${60+c} 290, ${60-c} ${hy+110}, 60 ${hy}`;
  const y1 = 250, y2 = 180;
  const leaves =
    `<path class="leaf" style="--ld:1s;transform-origin:60px ${y1}px" d="M60 ${y1} C 38 ${y1-6}, 16 ${y1-22}, 8 ${y1-46} C 36 ${y1-44}, 56 ${y1-24}, 60 ${y1} Z"/>` +
    `<path class="leaf" style="--ld:1.25s;transform-origin:60px ${y2}px" d="M60 ${y2} C 82 ${y2-6}, 104 ${y2-22}, 112 ${y2-46} C 84 ${y2-44}, 64 ${y2-24}, 60 ${y2} Z"/>`;
  const el = document.createElement('div');
  el.className = 'pos';
  el.style.cssText = `left:${f.x}%;--h:${f.h};--d:${f.d}s;--sw:${f.sw}s;z-index:${f.front ? 2 : 1}`;
  el.innerHTML = `<svg class="flower" viewBox="0 0 120 360" aria-hidden="true">
    <path class="stem" pathLength="1" d="${stem}"/>${leaves}
    <g transform="translate(60 ${hy}) scale(1.35)"><g class="cup">${TULIP}</g></g></svg>`;
  return el;
}
FLOWERS.forEach(f => $('#bouquet').appendChild(buildFlower(f)));

/* Ramo pequeño de la pantalla de entrada */
$('#seedBox').innerHTML = `<svg viewBox="0 0 100 120" aria-hidden="true">
  <path d="M50 92 C34 84 22 68 18 50 C36 58 48 72 50 92 Z" fill="url(#lg)"/>
  <path d="M50 92 C66 84 78 68 82 50 C64 58 52 72 50 92 Z" fill="url(#lg)"/>
  <g stroke="#4a9a3c" stroke-width="3.2" stroke-linecap="round" fill="none">
    <path d="M50 96 L50 52"/><path d="M50 96 L31 60"/><path d="M50 96 L69 60"/>
  </g>
  <g transform="translate(31 58) rotate(-16) scale(.5)">${TULIP}</g>
  <g transform="translate(69 58) rotate(16) scale(.5)">${TULIP}</g>
  <g transform="translate(50 50) scale(.62)">${TULIP}</g>
  <path d="M24 78 Q50 90 76 78 L57 116 Q50 120 43 116 Z" fill="#fff1d2" stroke="rgba(190,120,30,.4)" stroke-width="1.2"/>
  <path d="M50 88 L41 82 L41 94 Z M50 88 L59 82 L59 94 Z" fill="#ff7f8f"/>
  <circle cx="50" cy="88" r="3" fill="#ff5f75"/>
</svg>`;
$('#gateTitle').textContent = CONFIG.to ? `${CONFIG.to}, tengo algo para ti` : 'Tengo algo para ti';

/* Partículas: luciérnagas y pétalos */
const fx = (function(){
  const cv = $('#fx'), ctx = cv.getContext('2d');
  let W = 0, H = 0, running = false, last = 0, spawn = 1;
  let flies = [], petals = [];

  const glow = document.createElement('canvas');
  glow.width = glow.height = 64;
  const g = glow.getContext('2d');
  const gr = g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,244,160,1)');
  gr.addColorStop(.25,'rgba(255,205,60,.6)');
  gr.addColorStop(1,'rgba(255,180,0,0)');
  g.fillStyle = gr; g.fillRect(0,0,64,64);

  function resize(){
    const r = cv.getBoundingClientRect();
    const d = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = Math.round(W*d); cv.height = Math.round(H*d);
    ctx.setTransform(d,0,0,d,0,0);
  }
  function mkFly(init){
    return {x:Math.random()*W, y:init ? Math.random()*H : H+10, s:6+Math.random()*13,
            vy:-(8+Math.random()*16), ph:Math.random()*6.28, sw:8+Math.random()*18, tw:1+Math.random()*2};
  }
  function fall(){
    petals.push({x:Math.random()*W, y:-12, vx:(Math.random()-.5)*20, vy:24+Math.random()*30,
      rot:Math.random()*6.28, vr:(Math.random()-.5)*3, s:5+Math.random()*4, a:.9, sway:Math.random()*6.28, burst:false, life:0});
  }
  function burst(x,y){
    for (let i = 0; i < 12; i++) {
      const a = Math.random()*6.28, v = 80+Math.random()*160;
      petals.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v-60, rot:Math.random()*6.28, vr:(Math.random()-.5)*8,
        s:5+Math.random()*5, a:1, sway:0, burst:true, life:0});
    }
  }
  function step(t){
    if (!running) return;
    const dt = Math.min((t-last)/1000, .05); last = t;
    ctx.clearRect(0,0,W,H);

    for (const f of flies) {
      f.y += f.vy*dt;
      f.x += Math.sin(t/1000*.8 + f.ph) * f.sw * dt;
      if (f.y < -20) Object.assign(f, mkFly(false));
      ctx.globalAlpha = .3 + .7*(.5 + .5*Math.sin(t/1000*f.tw + f.ph));
      ctx.drawImage(glow, f.x-f.s, f.y-f.s, f.s*2, f.s*2);
    }

    if (!reduced) {
      spawn -= dt;
      if (spawn <= 0 && petals.length < 44) { fall(); spawn = .7 + Math.random()*1.1; }
    }
    for (let i = petals.length-1; i >= 0; i--) {
      const p = petals[i];
      p.life += dt;
      if (p.burst) { p.vy += 240*dt; p.vx *= (1 - 1.4*dt); p.vy *= (1 - .6*dt); p.a = Math.max(0, 1 - p.life/1.6); }
      else { p.x += Math.sin(t/1000*1.3 + p.sway)*18*dt; }
      p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.vr*dt;
      if (p.y > H + 20 || p.a <= 0) { petals.splice(i,1); continue; }
      ctx.save();
      ctx.globalAlpha = p.a;
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = '#ffc61f';
      ctx.beginPath(); ctx.ellipse(0,0,p.s*.45,p.s,0,0,6.2832); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(step);
  }
  function start(){
    resize();
    if (!running) {
      flies = Array.from({length: reduced ? 10 : 34}, () => mkFly(true));
      running = true; last = performance.now();
      requestAnimationFrame(step);
    }
  }
  if ('ResizeObserver' in window) new ResizeObserver(resize).observe(cv);
  return {start, burst, get on(){return running}};
})();

/* Flujo */
let ctlTimer = 0;
function showControlsLater(){
  clearTimeout(ctlTimer);
  ctlTimer = setTimeout(() => controls.classList.add('show'), reduced ? 300 : 5800);
}
function start(){
  gate.classList.add('hide');
  stage.classList.add('go');
  fx.start();
  showControlsLater();
}
function replay(){
  closeLetter();
  controls.classList.remove('show');
  stage.classList.remove('go');
  void stage.offsetWidth;
  stage.classList.add('go');
  showControlsLater();
}

/* Carta con efecto máquina de escribir */
let runId = 0, fast = false;
const sleep = ms => (fast || reduced) ? Promise.resolve() : new Promise(r => setTimeout(r, ms));
async function typeLetter(){
  const my = ++runId; fast = false;
  const body = $('#letterBody'), sig = $('#sig');
  body.innerHTML = ''; sig.classList.remove('show');
  for (const para of CONFIG.letter) {
    const p = document.createElement('p');
    p.className = 'typing';
    body.appendChild(p);
    for (const ch of para) {
      if (my !== runId) return;
      p.textContent += ch;
      letterEl.scrollTop = letterEl.scrollHeight;
      await sleep(26);
    }
    p.classList.remove('typing');
    await sleep(380);
  }
  if (my === runId) { sig.classList.add('show'); letterEl.scrollTop = letterEl.scrollHeight; }
}
function openLetter(){
  veil.classList.add('open');
  typeLetter();
  $('#closeBtn').focus({preventScroll:true});
}
function closeLetter(){
  runId++;
  veil.classList.remove('open');
}

gate.addEventListener('click', start);
$('#openBtn').addEventListener('click', openLetter);
$('#replayBtn').addEventListener('click', replay);
$('#closeBtn').addEventListener('click', closeLetter);
veil.addEventListener('click', e => { if (e.target === veil) closeLetter(); });
letterEl.addEventListener('click', () => { fast = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLetter(); });
stage.addEventListener('pointerdown', e => {
  if (!fx.on || e.target.closest('button') || veil.classList.contains('open')) return;
  const r = stage.getBoundingClientRect();
  fx.burst(e.clientX - r.left, e.clientY - r.top);
});
</script>
